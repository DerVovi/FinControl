services:
  - type: web
    name: fincontrol
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix backend && npm run build --prefix frontend
    startCommand: node backend/dist/presentation/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://fincontrol.onrender.com
