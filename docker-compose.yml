version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fincontrol-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DATABASE_URL=file:/app/prisma/data/fincontrol.db
      - JWT_SECRET=${JWT_SECRET:-fincontrol_production_jwt_secret_key_minimum_32_characters_random}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-fincontrol_production_jwt_refresh_secret_key_minimum_32_characters_random}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:80}
    volumes:
      - fincontrol-db-data:/app/prisma/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fincontrol-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  fincontrol-db-data:
    driver: local
